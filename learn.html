<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小步练习</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ee;color:#233d3a;font:18px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:700px;margin:auto;padding:28px 18px}section{background:white;border:1px solid #d8dfd7;border-radius:20px;padding:24px;margin-top:20px}h1{font-size:30px}h2{font-size:23px}a{color:#246d60}button,input{font:inherit;min-height:52px;border-radius:12px;padding:12px 18px}button{border:0;background:#247b6c;color:white;cursor:pointer;margin:8px 8px 8px 0}button.secondary{background:#e4ece4;color:#233d3a}button:disabled{opacity:.5;cursor:default}input{display:block;width:100%;border:1px solid #97aaa0;margin:8px 0}label{display:block;font-weight:600}.note{color:#586d64;font-size:16px}.hidden{display:none!important}#question,#feedback,#hintText,#notice{white-space:pre-wrap}#notice{min-height:28px}#hintText{background:#eef3eb;padding:12px;border-radius:12px}li{margin-bottom:12px}:focus-visible{outline:3px solid #bf7b17;outline-offset:4px}
</style></head><body><main>
<a href="/">返回家长页面</a><h1>一步一步，自己试试</h1><p class="note">离线规则练习 · 不使用 AI</p><p id="curriculum" class="note">按能力练习 · 教材进度待核对</p>
<p id="notice" role="status" aria-live="polite">正在打开练习…</p><button id="reload" class="secondary">重新读取进度</button><button id="retry" class="hidden">重试刚才的操作</button>
<section id="practice" class="hidden"><h2 id="stage"></h2><p id="context" class="note"></p><p id="question"></p><p id="attempts" class="note"></p>
<form id="answerForm"><label id="answerLabel" for="answer">你的答案</label><input id="answer" inputmode="numeric" autocomplete="off" maxlength="60"><button id="submit" type="submit">检查答案</button><button id="unsure" type="button" class="secondary">我还不会，想要一点提示</button></form>
<p id="feedback" role="status" aria-live="polite"></p><button id="hint" class="secondary">给我一点提示</button><p id="hintText" class="hidden"></p><button id="next" class="hidden">换一道新题再试试</button>
</section><section id="summary" class="hidden"><h2>这次的练习小记</h2><ul id="evidence"></ul><p class="note">一次练习只提供一点学习线索，不代表已经掌握。以后换个情境再试试。</p></section>
</main><script>
const $=selector=>document.querySelector(selector);
const params=new URLSearchParams(location.search),sessionId=params.get('session'),learner=params.get('learner');
let session=null,busy=false,pending=null,needsReload=false,reloadOnIdle=false;
const validRoute=!!sessionId&&/^[A-Za-z0-9_-]{1,100}$/.test(sessionId)&&['sister','little_sister'].includes(learner);
const endpoint=()=>'/api/practice-sessions/'+encodeURIComponent(sessionId);
function notice(text){$('#notice').textContent=text;}
function syncControls(){const locked=busy||!!pending||needsReload||!session;$('#submit').disabled=locked||session.status!=='attempting';$('#answer').disabled=locked||session.status!=='attempting';$('#unsure').disabled=locked||session.status!=='attempting';$('#hint').disabled=locked||session.status!=='attempting'||session.attempt_count<1||session.hint_level>=3;$('#next').disabled=locked||session.stage!=='initial'||session.status!=='solved';$('#retry').classList.toggle('hidden',!pending);$('#retry').disabled=busy;$('#reload').disabled=busy||!validRoute;}
function render(data){session=data.session||data;const language=['chinese','english'].includes(session.subject);$('#answer').inputMode=language?'text':'numeric';$('#answerLabel').textContent=session.answer_instruction||'你的答案（只填数字）';$('#answer').placeholder=language?'按题目要求填写':'';$('#practice').classList.remove('hidden');$('#curriculum').textContent=session.curriculum_label||'按能力练习 · 教材进度待核对';$('#stage').textContent=session.stage==='transfer'?'换一道题，试试能不能用上':'先试一道题';$('#context').textContent=session.stage==='transfer'?'这是新的题目。先自己想一想，需要时再看提示。':'家长页面可能已经展示讲解和答案，这一题不作为独立学习证据。';$('#question').textContent=(session.subject_label?session.subject_label+' · ':'')+session.question;$('#attempts').textContent=session.attempt_count===0?'先独立试一次，之后可以选择看提示。':`本题已尝试 ${session.attempt_count} 次 · 已用提示 ${session.hint_level} 次`;$('#feedback').textContent=session.feedback||'';$('#hintText').textContent=session.hint_text||'';$('#hintText').classList.toggle('hidden',!session.hint_text);$('#next').classList.toggle('hidden',!(session.stage==='initial'&&session.status==='solved'));$('#answerForm').classList.toggle('hidden',session.status!=='attempting');$('#hint').classList.toggle('hidden',session.status!=='attempting');$('#evidence').replaceChildren();const evidence=session.evidence||[];$('#summary').classList.toggle('hidden',!evidence.length);for(const item of evidence){const li=document.createElement('li');li.textContent=item.kind==='initial'?'首题：可能已见过讲解，不计作独立学习证据。':item.independent_evidence?'新题：首次作答正确，且未用提示。这是一次独立应用的线索。':`新题：尝试 ${item.attempt_count} 次，使用 ${item.hints_used} 次提示。这是练习记录，尚不能作为独立应用的证据。`;$('#evidence').append(li);}syncControls();}
async function request(url,options){let response;try{response=await fetch(url,{...options,headers:{'Content-Type':'application/json'}});}catch{throw Error('网络连接中断');}let data;try{data=await response.json();}catch{const error=Error('未能读取服务响应');error.status=response.ok?0:response.status;throw error;}if(!response.ok){const error=Error(typeof data.detail==='string'?data.detail:'暂时无法完成，请重新读取进度');error.status=response.status;throw error;}return data;}
async function load(){if(busy||!validRoute)return;busy=true;needsReload=true;syncControls();try{const data=await request(endpoint()+'?learner='+encodeURIComponent(learner));pending=null;needsReload=false;render(data);$('#answer').value='';notice(session.status==='completed'?'这轮练习完成啦。可以把小记给家长看。':'进度已读取，按自己的节奏来。');}catch(error){notice(error.message+'。请重新读取进度。');}finally{busy=false;syncControls();if(reloadOnIdle){reloadOnIdle=false;await load();}}}
function uuid(){return crypto.randomUUID();}
async function act(kind){if(busy||needsReload||pending||!session)return;if(kind==='attempt'&&(session.status!=='attempting'||!$('#answer').value.trim()))return;if(kind==='hint'&&(session.status!=='attempting'||session.attempt_count<1||session.hint_level>=3))return;if(kind==='next'&&(session.stage!=='initial'||session.status!=='solved'))return;const body={learner,action_id:uuid(),expected_revision:session.revision};if(kind==='attempt')body.answer=$('#answer').value.trim();pending={url:endpoint()+'/'+kind,body:JSON.stringify(body)};await sendPending();}
async function sendPending(){if(busy||!pending)return;busy=true;syncControls();let stale=false;try{const data=await request(pending.url,{method:'POST',body:pending.body});pending=null;needsReload=false;render(data);$('#answer').value='';notice(session.status==='completed'?'这轮练习完成啦。可以把小记给家长看。':'进度已保存。');}catch(error){if(error.status===409){pending=null;needsReload=true;stale=true;notice('进度已变化，正在重新读取。请读题后再作答。');}else if(error.status>=400&&error.status<500){pending=null;notice(error.message);}else{notice('暂时无法确认刚才是否保存。请重试刚才的操作，或重新读取进度。');}}finally{busy=false;syncControls();if(reloadOnIdle){reloadOnIdle=false;await load();}}if(stale){await load();notice(needsReload?'进度读取失败，请重新读取后再作答。':'已读取最新进度；刚才的答案没有自动重交，请读题后再作答。');}}
$('#answerForm').onsubmit=event=>{event.preventDefault();return act('attempt');};$('#unsure').onclick=()=>{if(busy||pending||needsReload||!session||session.status!=='attempting')return;$('#answer').value='还不会';return act('attempt');};$('#hint').onclick=()=>act('hint');$('#next').onclick=()=>act('next');$('#retry').onclick=()=>sendPending();$('#reload').onclick=()=>load();
window.addEventListener('pageshow',event=>{if(event.persisted){if(busy)reloadOnIdle=true;else load();}});
if(validRoute){load();}else{notice('练习链接不完整，请返回家长页面重新开始。');syncControls();}
</script></body></html>
