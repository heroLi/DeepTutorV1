name: Offline learning tests
on:
  push:
    branches: ['dev/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      TUTOR_TTS_PROVIDER: preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact offline test dependencies
        run: python -m pip install --index-url https://pypi.org/simple -r requirements-ci.txt
      - name: Validate declared versions
        run: |
          python -m pip check
          python -c "import PIL; assert PIL.__version__ == '12.3.0'"
          python -m pip freeze
      - name: Python regression tests without outbound network
        run: python -m pytest -q
      - name: JavaScript state tests and syntax
        run: |
          node tests/test_offline_ui.js
          node tests/test_curriculum_ui.js
          python -c "from pathlib import Path; Path('/tmp/tutor-ui.js').write_text(Path('index.html').read_text().split('<script>')[1].split('</script>')[0])"
          node --check /tmp/tutor-ui.js
      - name: Python syntax
        run: python -m compileall -q app.py core.py curriculum.py tutor_provider.py render.py tests
